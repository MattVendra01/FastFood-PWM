<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FastFood - Catalogo</title>

    <!-- Icona della pagina -->
    <link rel="icon" type="image/svg+xml" href="../immagini/favicon.svg">
    <!-- Bootstrap e stile personalizzato -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/stile.css">
</head>

<body>
    <!-- ============================================================
         NAVBAR
         ============================================================ -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand logo-fastfood" href="../index.html">
                FastFood
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuNavigazione" aria-controls="menuNavigazione"
                aria-expanded="false" aria-label="Apri o chiudi il menu di navigazione">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNavigazione">
                <ul id="listaNavigazione" class="navbar-nav ms-auto">
                    <!-- Link generati da utilita.js -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- ============================================================
         CATALOGO PIATTI
         ============================================================ -->
    <main class="container contenitore-pagina">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
            <h1 class="mb-0">Catalogo piatti</h1>

            <a href="area-ristoratore.html" class="btn btn-outline-secondary">
                Torna all'area ristoratore
            </a>
        </div>

        <p class="text-muted">
            Cerca un piatto, inserisci il prezzo e aggiungilo al menu del tuo ristorante.
        </p>

        <div id="messaggioCatalogo" aria-live="polite"></div>

        <!-- ============================================================
             RICERCA
             ============================================================ -->
        <form id="formRicercaCatalogo" class="row g-2 mb-4">
            <div class="col-md-9">
                <input type="text" id="ricercaNomeCatalogo"
                    class="form-control" placeholder="Cerca un piatto per nome">
            </div>

            <div class="col-md-3">
                <button type="submit" class="btn btn-danger w-100">
                    Cerca
                </button>
            </div>
        </form>

        <!-- ============================================================
             ELENCO PIATTI
             ============================================================ -->
        <div id="listaCatalogoPiatti" class="row g-3"></div>

        <!-- ============================================================
             PAGINAZIONE
             ============================================================ -->
        <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
            <button type="button" id="bottonePrecedente"
                class="btn btn-outline-danger">
                Precedente
            </button>

            <span id="testoPagina"></span>

            <button type="button" id="bottoneSuccessivo"
                class="btn btn-outline-danger">
                Successiva
            </button>
        </div>
    </main>

    <!-- ============================================================
         SCRIPT
         ============================================================ -->
    <script src="../js/utilita.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/catalogo.js"></script>
    <!-- JavaScript di Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
