<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FastFood - Area Ristoratore</title>

    <!-- Icona della pagina -->
    <link rel="icon" type="image/svg+xml" href="../immagini/favicon.svg">
    <!-- Bootstrap e stile personalizzato -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/stile.css">
</head>

<body>
    <!-- ============================================================
         NAVBAR
         ============================================================ -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand logo-fastfood" href="../index.html">
                FastFood
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuNavigazione" aria-controls="menuNavigazione"
                aria-expanded="false" aria-label="Apri o chiudi il menu di navigazione">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNavigazione">
                <ul id="listaNavigazione" class="navbar-nav ms-auto">
                    <!-- Link generati da utilita.js -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- ============================================================
         AREA RISTORATORE
         ============================================================ -->
    <main class="container contenitore-pagina">
        <h1 class="mb-3">Area ristoratore</h1>

        <p id="benvenutoRistoratore" class="text-muted"></p>

        <div id="messaggioRistoratore" aria-live="polite"></div>

        <!-- ============================================================
             CREAZIONE RISTORANTE
             ============================================================ -->
        <section id="sezioneCreaRistorante" class="card shadow-sm mt-4">
            <div class="card-body">
                <h2 class="h4 mb-3">Crea il tuo ristorante</h2>

                <form id="formCreaRistorante">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nomeRistorante" class="form-label">
                                Nome ristorante
                            </label>
                            <input type="text" id="nomeRistorante"
                                class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label for="partitaIVA" class="form-label">
                                Partita IVA
                            </label>
                            <input type="text" id="partitaIVA"
                                class="form-control" inputmode="numeric"
                                maxlength="11" required>
                        </div>

                        <div class="col-md-6">
                            <label for="telefonoRistorante" class="form-label">
                                Telefono
                            </label>
                            <input type="text" id="telefonoRistorante"
                                class="form-control" inputmode="numeric"
                                maxlength="15" required>
                        </div>

                        <div class="col-md-6">
                            <label for="citta" class="form-label">
                                Città
                            </label>
                            <input type="text" id="citta"
                                class="form-control" required>
                        </div>

                        <div class="col-12">
                            <label for="indirizzo" class="form-label">
                                Indirizzo
                            </label>
                            <input type="text" id="indirizzo"
                                class="form-control" required>
                        </div>

                        <div class="col-12">
                            <label for="immagine" class="form-label">
                                URL immagine
                            </label>
                            <input type="text" id="immagine"
                                class="form-control">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-danger mt-3">
                        Crea ristorante
                    </button>
                </form>
            </div>
        </section>

        <!-- ============================================================
             GESTIONE RISTORANTE E MENU
             ============================================================ -->
        <section id="sezioneMenuRistorante" class="card shadow-sm mt-4 d-none">
            <div class="card-body">
                <h2 class="h4 mb-3">Menu del tuo ristorante</h2>

                <div id="datiMioRistorante" class="mb-3"></div>

                <div class="d-flex flex-wrap gap-2 mb-3">
                    <button type="button" id="bottoneMostraFormRistorante"
                        class="btn btn-outline-danger">
                        Modifica dati ristorante
                    </button>

                    <a href="catalogo.html" class="btn btn-outline-danger">
                        Aggiungi piatto da catalogo
                    </a>

                    <button type="button" id="bottoneMostraFormPiatto"
                        class="btn btn-outline-danger">
                        Aggiungi nuovo piatto
                    </button>

                    <a href="ordine.html" class="btn btn-outline-danger">
                        Ordini e statistiche
                    </a>

                    <button type="button" id="bottoneEliminaRistorante"
                        class="btn btn-outline-danger">
                        Elimina ristorante
                    </button>
                </div>

                <!-- ============================================================
                     MODIFICA RISTORANTE
                     ============================================================ -->
                <form id="formModificaRistorante" class="row g-3 d-none mb-4">
                    <div class="col-md-6">
                        <label for="modificaNomeRistorante" class="form-label">
                            Nome ristorante
                        </label>
                        <input type="text" id="modificaNomeRistorante"
                            class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label for="modificaPartitaIVA" class="form-label">
                            Partita IVA
                        </label>
                        <input type="text" id="modificaPartitaIVA" class="form-control"
                            inputmode="numeric" maxlength="11" required>
                    </div>

                    <div class="col-md-6">
                        <label for="modificaTelefonoRistorante" class="form-label">
                            Telefono
                        </label>
                        <input type="text" id="modificaTelefonoRistorante"
                            class="form-control" inputmode="numeric"
                            maxlength="15" required>
                    </div>

                    <div class="col-md-6">
                        <label for="modificaCittaRistorante" class="form-label">
                            Città
                        </label>
                        <input type="text" id="modificaCittaRistorante"
                            class="form-control" required>
                    </div>

                    <div class="col-12">
                        <label for="modificaIndirizzoRistorante" class="form-label">
                            Indirizzo
                        </label>
                        <input type="text" id="modificaIndirizzoRistorante"
                            class="form-control" required>
                    </div>

                    <div class="col-12">
                        <label for="modificaImmagineRistorante" class="form-label">
                            URL immagine
                        </label>
                        <input type="text" id="modificaImmagineRistorante"
                            class="form-control">
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-danger">
                            Salva modifiche ristorante
                        </button>
                    </div>
                </form>

                <!-- ============================================================
                     CREAZIONE PIATTO
                     ============================================================ -->
                <form id="formCreaPiatto" class="row g-3 d-none mb-4">
                    <div class="col-md-6">
                        <label for="nomePiatto" class="form-label">
                            Nome piatto
                        </label>
                        <input type="text" id="nomePiatto"
                            class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label for="categoriaPiatto" class="form-label">
                            Categoria
                        </label>
                        <input type="text" id="categoriaPiatto"
                            class="form-control" required>
                    </div>

                    <div class="col-md-4">
                        <label for="prezzoPiatto" class="form-label">
                            Prezzo
                        </label>
                        <input type="number" id="prezzoPiatto"
                            class="form-control" step="0.01"
                            min="0" required>
                    </div>

                    <div class="col-md-8">
                        <label for="immaginePiatto" class="form-label">
                            URL immagine
                        </label>
                        <input type="text" id="immaginePiatto"
                            class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label for="ingredientiPiatto" class="form-label">
                            Ingredienti
                        </label>
                        <input type="text" id="ingredientiPiatto"
                            class="form-control" placeholder="Esempio: pane, carne, insalata">
                    </div>

                    <div class="col-md-6">
                        <label for="allergeniPiatto" class="form-label">
                            Allergeni
                        </label>
                        <input type="text" id="allergeniPiatto"
                            class="form-control" placeholder="Esempio: glutine, latte">
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-danger">
                            Aggiungi piatto
                        </button>
                    </div>
                </form>

                <!-- ============================================================
                     MODIFICA PIATTO
                     ============================================================ -->
                <form id="formModificaPiatto" class="row g-3 d-none mb-4">
                    <input type="hidden" id="idPiattoModifica">

                    <h3 class="h5">Modifica piatto</h3>

                    <div class="col-md-6">
                        <label for="modificaNomePiatto" class="form-label">
                            Nome piatto
                        </label>
                        <input type="text" id="modificaNomePiatto"
                            class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label for="modificaCategoriaPiatto" class="form-label">
                            Categoria
                        </label>
                        <input type="text" id="modificaCategoriaPiatto"
                            class="form-control" required>
                    </div>

                    <div class="col-md-4">
                        <label for="modificaPrezzoPiatto" class="form-label">
                            Prezzo
                        </label>
                        <input type="number" id="modificaPrezzoPiatto"
                            class="form-control" step="0.01"
                            min="0" required>
                    </div>

                    <div class="col-md-8">
                        <label for="modificaImmaginePiatto" class="form-label">
                            URL immagine
                        </label>
                        <input type="text" id="modificaImmaginePiatto"
                            class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label for="modificaIngredientiPiatto" class="form-label">
                            Ingredienti
                        </label>
                        <input type="text" id="modificaIngredientiPiatto"
                            class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label for="modificaAllergeniPiatto" class="form-label">
                            Allergeni
                        </label>
                        <input type="text" id="modificaAllergeniPiatto"
                            class="form-control">
                    </div>

                    <div class="col-12">
                        <div class="form-check">
                            <input type="checkbox" id="modificaDisponibilePiatto"
                                class="form-check-input">
                            <label for="modificaDisponibilePiatto"
                                class="form-check-label">
                                Piatto disponibile
                            </label>
                        </div>
                    </div>

                    <div class="col-12 d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            Salva modifiche piatto
                        </button>

                        <button type="button" id="bottoneAnnullaModificaPiatto"
                            class="btn btn-outline-secondary">
                            Annulla
                        </button>
                    </div>
                </form>

                <!-- ============================================================
                     MENU DEL RISTORANTE
                     ============================================================ -->
                <hr>

                <h3 class="h5">Piatti presenti nel menu</h3>

                <div id="listaMenuRistoratore" class="row g-3"></div>
            </div>
        </section>
    </main>

    <!-- ============================================================
         SCRIPT
         ============================================================ -->
    <script src="../js/utilita.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/area-ristoratore.js"></script>
    <!-- JavaScript di Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
