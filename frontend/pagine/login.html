<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FastFood - Login</title>

    <!-- Icona della pagina -->
    <link rel="icon" type="image/svg+xml" href="../immagini/favicon.svg">
    <!-- Bootstrap e stile personalizzato -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/stile.css">
</head>

<body>
    <!-- ============================================================
         NAVBAR
         ============================================================ -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand logo-fastfood" href="../index.html">
                FastFood
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuNavigazione" aria-controls="menuNavigazione"
                aria-expanded="false" aria-label="Apri o chiudi il menu di navigazione">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNavigazione">
                <ul id="listaNavigazione" class="navbar-nav ms-auto">
                    <!-- Contenuto inserito da utilita.js -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- ============================================================
         FORM DI LOGIN
         ============================================================ -->
    <main class="container contenitore-pagina">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h1 class="h3 mb-4 text-center">Login</h1>

                        <form id="formLogin">
                            <!-- Email -->
                            <div class="mb-3">
                                <label for="emailLogin" class="form-label">
                                    Email
                                </label>

                                <input type="email" class="form-control"
                                    id="emailLogin" name="email"
                                    autocomplete="email" required>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="passwordLogin" class="form-label">
                                    Password
                                </label>

                                <div class="input-group">
                                    <input type="password" class="form-control"
                                        id="passwordLogin" name="password"
                                        autocomplete="current-password" required>

                                    <button type="button" class="btn btn-outline-secondary"
                                        id="mostraPasswordLogin" aria-label="Mostra password"
                                        aria-pressed="false">
                                        <svg class="icona-password" xmlns="http://www.w3.org/2000/svg"
                                            width="18" height="18" fill="currentColor"
                                            viewBox="0 0 16 16" aria-hidden="true">
                                            <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM8 12a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>
                                            <path d="M8 10.5A2.5 2.5 0 1 0 8 5a2.5 2.5 0 0 0 0 5.5z"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-danger w-100">
                                Accedi
                            </button>
                        </form>

                        <!-- Messaggi di errore restituiti durante il login -->
                        <div id="messaggioLogin" aria-live="polite"></div>

                        <!-- Collegamento alla registrazione -->
                        <p class="text-center mt-3 mb-0">
                            Non hai un account?
                            <a href="registrazione.html">Registrati!</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ============================================================
         SCRIPT
         ============================================================ -->
    <script src="../js/utilita.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/login.js"></script>
    <!-- JavaScript di Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
