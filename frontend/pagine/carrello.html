<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FastFood - Carrello</title>

    <!-- Icona della pagina -->
    <link rel="icon" type="image/svg+xml" href="../immagini/favicon.svg">
    <!-- Bootstrap e stile personalizzato -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/stile.css">
</head>

<body>
    <!-- ============================================================
         NAVBAR
         ============================================================ -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand logo-fastfood" href="../index.html">
                FastFood
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuNavigazione" aria-controls="menuNavigazione"
                aria-expanded="false" aria-label="Apri o chiudi il menu di navigazione">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNavigazione">
                <ul id="listaNavigazione" class="navbar-nav ms-auto">
                    <!-- Link generati da utilita.js -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- ============================================================
         CARRELLO
         ============================================================ -->
    <main class="container contenitore-pagina">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">Carrello</h1>

            <a href="area-cliente.html" class="btn btn-outline-secondary">
                Torna alla mia area 
            </a>
        </div>

        <div id="messaggioCarrello" aria-live="polite"></div>

        <div class="card shadow-sm">
            <div class="card-body">
                <h2 id="titoloCarrello" class="h5 mb-3">Piatti selezionati</h2>

                <!-- ============================================================
                     PIATTI NEL CARRELLO
                     ============================================================ -->
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Piatto</th>
                                <th>Prezzo</th>
                                <th>Quantità</th>
                                <th>Subtotale</th>
                                <th></th>
                            </tr>
                        </thead>

                        <tbody id="tabellaCarrello">
                            <!-- Righe generate da carrello.js -->
                        </tbody>
                    </table>
                </div>

                <!-- ============================================================
                     TOTALE E AZIONI
                     ============================================================ -->
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <h3 class="h4 mb-0">Totale: €<span id="totaleCarrello">0.00</span></h3>

                    <div class="d-flex gap-2">
                        <button type="button" id="bottoneSvuotaCarrello"
                            class="btn btn-outline-secondary" >
                            Svuota carrello
                        </button>

                        <button type="button" id="bottoneConfermaOrdine"
                            class="btn btn-danger">
                            Conferma ordine
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ============================================================
         SCRIPT
         ============================================================ -->
    <script src="../js/utilita.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/carrello.js"></script>
    <!-- JavaScript di Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
