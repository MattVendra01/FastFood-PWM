<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FastFood - Ordini</title>

    <!-- Icona della pagina -->
    <link rel="icon" type="image/svg+xml" href="../immagini/favicon.svg">
    <!-- Bootstrap e stile personalizzato -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/stile.css">
</head>

<body>
    <!-- ============================================================
         NAVBAR
         ============================================================ -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand logo-fastfood" href="../index.html">
                FastFood
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuNavigazione" aria-controls="menuNavigazione"
                aria-expanded="false" aria-label="Apri o chiudi il menu di navigazione">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNavigazione">
                <ul id="listaNavigazione" class="navbar-nav ms-auto">
                    <!-- Link generati da utilita.js -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- ============================================================
         ORDINI
         ============================================================ -->
    <main class="container contenitore-pagina">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h1 class="mb-0">Ordini</h1>

            <a id="bottoneTornaArea" class="btn btn-outline-secondary">
                Torna alla mia area
            </a>
        </div>

        <p id="nomeRistoranteGestito" class="text-muted mb-4"></p>

        <div id="messaggioOrdini" aria-live="polite"></div>

        <!-- ============================================================
             ORDINI CLIENTE
             ============================================================ -->
        <section id="sezioneCliente" class="d-none">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h2 class="h5 mb-3">I miei acquisti</h2>

                    <div id="listaAcquistiCliente"></div>
                </div>
            </div>
        </section>

        <!-- ============================================================
             ORDINI E STATISTICHE RISTORATORE
             ============================================================ -->
        <section id="sezioneRistoratore" class="d-none">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h2 class="h5 mb-3">Statistiche ristorante</h2>

                    <div id="statisticheRistorante"></div>
                </div>
            </div>

            <div id="listaOrdiniRistoratore"></div>
        </section>
    </main>

    <!-- ============================================================
         SCRIPT
         ============================================================ -->
    <script src="../js/utilita.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ordine.js"></script>
    <!-- JavaScript di Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
