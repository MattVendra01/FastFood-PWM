<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FastFood - Menu</title>

    <!-- Icona della pagina -->
    <link rel="icon" type="image/svg+xml" href="../immagini/favicon.svg">
    <!-- Bootstrap e stile personalizzato -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/stile.css">
</head>

<body>
    <!-- ============================================================
         NAVBAR
         ============================================================ -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand logo-fastfood" href="../index.html">
                FastFood
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuNavigazione" aria-controls="menuNavigazione"
                aria-expanded="false" aria-label="Apri o chiudi il menu di navigazione">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNavigazione">
                <ul id="listaNavigazione" class="navbar-nav ms-auto">
                    <!-- Link generati da utilita.js -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- ============================================================
         MENU DEL RISTORANTE
         ============================================================ -->
    <main class="container contenitore-pagina">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 id="titoloMenu" class="mb-1">Menu ristorante</h1>

                <p id="infoRistorante"class="text-muted mb-0"></p>
            </div>

            <div class="d-flex gap-2">
                <a href="ristorante.html" class="btn btn-outline-secondary">
                    Torna ai ristoranti
                </a>

                <a id="bottoneVaiCarrello" href="carrello.html"
                    class="btn btn-outline-danger d-none">
                    Vai al carrello
                </a>
            </div>
        </div>

        <!-- ============================================================
             RICERCA PIATTI
             ============================================================ -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="h5 mb-3">Cerca nel menu</h2>

                <form id="formRicercaPiatti" class="row g-3">
                    <div class="col-md-2">
                        <label for="nomePiatto" class="form-label">Nome</label>
                        <input type="text" id="nomePiatto" class="form-control" placeholder="Esempio: Apple">
                    </div>

                    <div class="col-md-2">
                        <label for="categoriaPiatto" class="form-label">Categoria</label>
                        <input type="text" id="categoriaPiatto" class="form-control" placeholder="Esempio: Dessert">
                    </div>

                    <div class="col-md-2">
                        <label for="prezzoMin" class="form-label">Prezzo min</label>
                        <input type="number" id="prezzoMin" class="form-control" min="1" step="0.01" placeholder="Esempio: 1.00">
                    </div>

                    <div class="col-md-2">
                        <label for="prezzoMax" class="form-label">Prezzo max</label>
                        <input type="number" id="prezzoMax" class="form-control" min="1" step="0.01" placeholder="Esempio: 20.00">
                    </div>

                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-danger w-100">Cerca</button>
                    </div>

                    <div class="col-md-2 d-flex align-items-end">
                        <button type="button" id="bottoneResetPiatti" class="btn btn-outline-secondary w-100">
                            Mostra tutti
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div id="messaggioPiatti" aria-live="polite"></div>

        <!-- ============================================================
             ELENCO PIATTI
             ============================================================ -->
        <div id="listaPiatti" class="row g-4"></div>

        <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
            <button type="button" id="bottonePrecedente" class="btn btn-outline-secondary">
                Precedente
            </button>

            <span id="testoPagina"></span>

            <button type="button" id="bottoneSuccessivo" class="btn btn-outline-secondary">
                Successivo
            </button>
        </div>
    </main>

    <!-- ============================================================
         SCRIPT
         ============================================================ -->
    <script src="../js/utilita.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/carrello.js"></script>
    <script src="../js/menu.js"></script>
    <!-- JavaScript di Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
