<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FastFood - Ristoranti</title>

    <!-- Icona della pagina -->
    <link rel="icon" type="image/svg+xml" href="../immagini/favicon.svg">
    <!-- Bootstrap e stile personalizzato -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/stile.css">
</head>

<body>
    <!-- ============================================================
         NAVBAR
         ============================================================ -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand logo-fastfood" href="../index.html">
                FastFood
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuNavigazione" aria-controls="menuNavigazione"
                aria-expanded="false" aria-label="Apri o chiudi il menu di navigazione">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNavigazione">
                <ul id="listaNavigazione" class="navbar-nav ms-auto">
                    <!-- Link generati da utilita.js -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- ============================================================
         RISTORANTI DISPONIBILI
         ============================================================ -->
    <main class="container contenitore-pagina">
        <h1 class="mb-4">Ristoranti disponibili</h1>

        <!-- ============================================================
             RICERCA RISTORANTI
             ============================================================ -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="h5 mb-3">Cerca ristorante</h2>

                <form id="formRicercaRistoranti" class="row g-3">
                    <div class="col-md-4">
                        <label for="nomeRistorante" class="form-label">
                            Nome ristorante
                        </label>

                        <input type="text" id="nomeRistorante"
                            class="form-control" placeholder="Esempio: FastFood">
                    </div>

                    <div class="col-md-4">
                        <label for="cittaRistorante" class="form-label">
                            Città
                        </label>

                        <input type="text" id="cittaRistorante"
                            class="form-control" placeholder="Esempio: Milano">
                    </div>

                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-danger w-100">
                            Cerca
                        </button>
                    </div>

                    <div class="col-md-2 d-flex align-items-end">
                        <button type="button" id="bottoneResetRicerca"
                            class="btn btn-outline-secondary w-100">
                            Mostra tutti
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div id="messaggioRistoranti" aria-live="polite"></div>

        <!-- ============================================================
             ELENCO RISTORANTI
             ============================================================ -->
        <div id="listaRistoranti" class="row g-4"></div>
            <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
                <button type="button" id="bottonePrecedente"
                    class="btn btn-outline-secondary">
                    Precedente
                </button>

                <span id="testoPagina"></span>

                <button type="button" id="bottoneSuccessivo"
                    class="btn btn-outline-secondary">
                    Successivo
                </button>
            </div>
    </main>

    <!-- ============================================================
         SCRIPT
         ============================================================ -->
    <script src="../js/utilita.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ristorante.js"></script>
    <!-- JavaScript di Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
